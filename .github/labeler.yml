# auto-label 路径映射表（actions/labeler 语法）
# 根据改动文件自动打标签；缺失标签会在 sync-labels: true 时自动创建。
# 适配 attention 仓库真实结构：Claude Skill 仓库（纯 Markdown + 双 shell 脚本 + evals）。
# 原则：type:bug 不参与路径推断（由 issue 模板承载），每个 label 至少命中一类真实文件。

📋 type:task:
  - changed-files:
      - any-glob-to-any-file:
          - 'SKILL.md'

📝 type:docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'AGENTS.md'
          - 'LESSONS.md'
          - 'CONTRIBUTING.md'
          - 'CHANGELOG.md'
          - 'SECURITY.md'
          - 'docs/**'
          - 'references/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/PULL_REQUEST_TEMPLATE.md'

🥇 evals:
  - changed-files:
      - any-glob-to-any-file:
          - 'evals/**'
          - 'assets/templates/**'

🧪 area:scripts:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'

⚙️ area:infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'assets/*.svg'
          - '.gitattributes'
          - '.gitignore'

🔖 priority:P0:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/*ci*'
          - '.github/workflows/*release*'
          - 'AGENTS.md'
          - 'SECURITY.md'
