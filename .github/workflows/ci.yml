name: CI

# 商业级门禁：任何 push / PR 都必须过三层校验与冒烟，且两种 shell 各跑一遍。
# 触发收窄到 main：功能分支的改动由 PR（base=main）承载校验，避免每个中间 push 都烧一遍额度。
#
# 两个 job 都跑在 ubuntu-latest。原 windows job 的 .ps1 侧校验保留，
# 只是换成 Linux 上的 pwsh（GitHub 托管 runner 自带）。
# 原因：windows-latest 按 2 倍计费，289 分钟/月 = 578 额度分钟，占免费额度 29%，
# 而 .ps1 逻辑本身与 OS 无关（脚本用 Get-Command bash 探测，不依赖 Windows 路径）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认收紧权限：CI 只需要读代码
permissions:
  contents: read

# 同一 ref 上只保留最新一次运行，省额度也避免陈旧结果误导
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash:
    name: linux / bash
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 版本与依赖自述（排障用）
        run: |
          bash --version | head -1
          python3 -V
          git --version

      # 打包层硬门：frontmatter 坏了，CI 之前是完全看不出来的（实测踩过：结束分隔符
      # 被粘到上一行，skill 加载器读不到 name/description，而 5 个采集脚本的断言全绿）。
      - name: 校验 SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          p = Path("SKILL.md")
          if not p.exists():
              sys.exit("::error::SKILL.md 不存在")
          lines = p.read_text(encoding="utf-8").splitlines()
          if not lines or lines[0].strip() != "---":
              sys.exit("::error::SKILL.md 第一行必须是独立的 ---")
          try:
              end = next(i for i in range(1, min(len(lines), 60)) if lines[i].strip() == "---")
          except StopIteration:
              sys.exit("::error::SKILL.md 的 frontmatter 没有独立的结束 ---（分隔符可能被粘到了上一行）")
          fm = lines[1:end]
          for key in ("name:", "description:"):
              if not any(l.startswith(key) for l in fm):
                  sys.exit(f"::error::frontmatter 缺少 {key}")
          print(f"OK: frontmatter 在第 {end + 1} 行闭合，含 name/description")
          PY

      # bash 侧 runner 需要 python 做严格 JSON 校验；缺了它会明确 SKIP 并退出 2（不会假装通过）
      - name: run_evals（bash runner）
        run: bash evals/run_evals.sh --fixtures-dir "$RUNNER_TEMP/attention-evals-ci-sh"

      - name: smoke_test（bash 侧）
        run: bash scripts/smoke_test.sh --repo .

      - name: 负例：无效 --repo 必须判失败（非 git 目录则应判通过）
        run: |
          set -e
          # 无效路径 → 冒烟必须失败
          if bash scripts/smoke_test.sh --repo "$RUNNER_TEMP/definitely-not-a-repo"; then
            echo "::error::无效 --repo 竟然通过——--repo 校验失效"; exit 1
          fi
          # 真实存在但非 git 的目录 → 冒烟应当通过（is_git=false 正是正确结论，不该被当成失败）
          tmp="$(mktemp -d)"
          bash scripts/smoke_test.sh --repo "$tmp"
          echo "负例与正例均符合预期"

  pwsh:
    name: linux / pwsh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 版本与依赖自述（排障用）
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version
          bash --version | Select-Object -First 1

      # 三层校验：严格 JSON + .sh/.ps1 逐字段 parity + 断言表
      # runner 会自动探测 bash 并同时跑两套实现
      - name: run_evals（pwsh runner，含 bash 侧 parity）
        shell: pwsh
        run: |
          # 跨平台：$env:TEMP 在 Linux 上为空，拼出的 "/attention-evals-ci" 落在文件系统根，
          # 生成 fixture 时被拒（CI 首次真跑即挂在这里）。RUNNER_TEMP 在所有 runner 上都有。
          $base = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $fx = Join-Path $base 'attention-evals-ci'
          pwsh -NoProfile -File evals/run_evals.ps1 -FixturesDir $fx

      - name: smoke_test（双实现语义断言）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke_test.ps1 --repo .